<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hartson Heating">
  <!-- Same flame as the header wordmark. Tile #2fd37a (the action green),
       flame #0b0f0d (near-black), matching logo.tsx at 9.9:1. Was #1f5bff,
       which put a blue tile in every browser tab of a green and black site.
       Note: no double hyphens in this comment, so keep CSS custom property
       names out of it. A double hyphen is illegal inside an XML comment and
       makes the whole file fail to parse in a strict reader. -->
  <rect width="64" height="64" rx="14" fill="#2fd37a"/>
  <g fill="#0b0f0d" transform="translate(12 10) scale(2.2)">
    <path d="M9 1c1 3.2 4.8 5 4.8 9.6A4.8 4.8 0 019 15.4a4.8 4.8 0 01-4.8-4.8C4.2 7.4 6.6 6.3 6.6 3.6 7.6 4.6 8 5.6 8 6.6 8.6 5 9 3.2 9 1z"/>
    <path d="M9 18.5c-2.3 0-3.7-1-3.7-1s1.4-1 3.7-1 3.7 1 3.7 1-1.4 1-3.7 1z" opacity="0.7"/>
  </g>
</svg>
